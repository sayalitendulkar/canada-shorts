# Builds the Android app for free on GitHub and publishes the install file (APK)
# on the project's "Releases" page. Runs when you press "Run workflow", or when
# files in the app/ folder change.
# If something fails, the error is copied to the run's Summary page so it can be
# read without opening the long logs.
name: Build Android app

on:
  workflow_dispatch: {}
  push:
    paths:
      - "app/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project files
        run: |
          flutter --version
          flutter create . --platforms=android --org ca.canadashorts --project-name canada_shorts
          rm -f test/widget_test.dart
          python3 tool/patch_android.py

      - name: Get packages
        run: flutter pub get

      - name: Check the code
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1
          status=$?
          cat analyze.log
          if [ $status -ne 0 ]; then
            { echo "## Code check found errors"; echo '```'; grep -E "error •|error -" analyze.log | head -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            grep -E "error •|error -" analyze.log | head -20 | while read -r line; do echo "::error::$line"; done
          fi
          exit $status

      - name: Run tests
        run: flutter test

      - name: Build the app (APK)
        run: |
          set +e
          flutter build apk --release --build-name "0.1.${{ github.run_number }}" --build-number "${{ github.run_number }}" > build.log 2>&1
          status=$?
          cat build.log
          if [ $status -ne 0 ]; then
            { echo "## App build failed"; echo '```'; grep -iE "error|exception|what went wrong|\.dart:[0-9]+" build.log | grep -v "^\s*at " | head -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            grep -iE "error:|\.dart:[0-9]+:[0-9]+" build.log | head -20 | while read -r line; do echo "::error::$line"; done
          fi
          exit $status

      - name: Rename
        run: cp build/app/outputs/flutter-apk/app-release.apk "canada-shorts-0.1.${{ github.run_number }}.apk"

      - name: Allow the phone simulator to run
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start-up test on a simulated Android phone
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: app
          script: bash tool/smoke_test.sh

      - uses: actions/upload-artifact@v5
        with:
          name: canada-shorts-apk
          path: app/canada-shorts-*.apk

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "app-0.1.${{ github.run_number }}"
          name: "Test app 0.1.${{ github.run_number }}"
          prerelease: true
          body: "Test version for your Android phone. Download the .apk file below and open it on your phone."
          files: app/canada-shorts-*.apk
